    <text x="832" y="796" font-size="13" fill="#115E59">Beli 2 cup berbayar → dapat 1 voucher setelah lunas. Sisa progres: 0.</text>
    <text x="816" y="851" font-size="14" fill="#475569">Voucher saat ini: 0 • Hadiah baru berlaku pada transaksi berikutnya.</text>
    <g fill="#FFFFFF" stroke="#CBD5E1">
